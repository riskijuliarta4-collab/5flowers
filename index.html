<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Bunga Katanya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background: linear-gradient(to bottom, #040816 0%, #0d1630 30%, #18284f 65%, #233765 100%);
    font-family:Georgia,serif;
}

.scene{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* ===================================================
   FLOWER FIELD: Responsif & Lebih Besar di HP
====================================================== */
.flower-field{
    position:absolute;
    left:50%;
    bottom:140px; /* Dinaikkan sedikit dari batas ground */
    transform: translateX(-50%);
    width: 100%;          
    max-width: 900px;     
    aspect-ratio: 9 / 6;  
    pointer-events:none;
    transform-origin: bottom center;
    transition: transform 0.5s ease;
}

/* Kustomisasi Khusus untuk Layar HP */
@media (max-width: 768px) {
    .flower-field {
        /* Zoom in sebesar 1.5 kali di HP agar bunga terlihat rimbun dan besar */
        transform: translateX(-50%) scale(1.5); 
        bottom: 160px;
    }
}

.stem-svg{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;           
    height:100%;          
}

/* ======================
   STEMS (Batang)
====================== */
.stem{
    fill:none;
    stroke:#4c9b58;
    stroke-width:8;
    stroke-linecap:round;
    stroke-dasharray:600;
    stroke-dashoffset:600;
    animation: growStem 3s ease forwards;
    transform-origin: bottom center;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), stroke 0.5s ease;
}

.s1{ animation-delay:.5s; }
.s2{ animation-delay:1.1s; }
.s3{ animation-delay:1.7s; }
.s4{ animation-delay:2.3s; }
.s5{ animation-delay:2.9s; }

@keyframes growStem{
    to { stroke-dashoffset:0; }
}

/* ======================
   LEAVES (Daun)
====================== */
.leaf {
    opacity: 0;
    transform-origin: initial; 
    animation: leafGrow 1.2s ease forwards;
    transition: transform 0.8s ease, opacity 0.5s ease;
}

.l1{ animation-delay:3.2s; }
.l2{ animation-delay:3.6s; }
.l3{ animation-delay:4.0s; }
.l4{ animation-delay:4.4s; }
.l5{ animation-delay:4.8s; }

@keyframes leafGrow{
    from{ opacity:0; transform: scale(0); }
    to{ opacity:1; transform: scale(1); }
}

/* ======================
   BUDS (Kuncup)
====================== */
.bud {
    opacity: 0;
    transform-origin: center bottom;
    animation: budToBloom 2.5s ease forwards;
}

.b1{ animation-delay: 3.5s; }
.b2{ animation-delay: 4.1s; }
.b3{ animation-delay: 4.7s; }
.b4{ animation-delay: 5.3s; }
.b5{ animation-delay: 5.9s; }

@keyframes budToBloom {
    0% { opacity: 0; transform: scale(0); }
    40% { opacity: 1; transform: scale(1); }
    70% { opacity: 1; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(0); }
}
    
/* ======================
   BLOOMING FLOWERS (Bunga Mekar)
====================== */
.tulip {
    opacity: 0;
    animation: bloomTulip 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transition: transform 1.5s cubic-bezier(0.15, 0.85, 0.35, 1), opacity 1s ease;
}

.t1 { animation-delay: 5.2s; }
.t2 { animation-delay: 5.8s; }
.t3 { animation-delay: 6.4s; }
.t4 { animation-delay: 7.0s; }
.t5 { animation-delay: 7.6s; }

@keyframes bloomTulip {
    0% { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
}

/* ======================
   ANIMASI PUTING BELIUNG
====================== */
.chaos .tulip {
    transform: scale(0) rotate(1080deg) translate(300px, -500px) !important;
    opacity: 0 !important;
}

.chaos .stem {
    transform: skewX(-50deg) scaleY(0.2);
    stroke: #5e3a21 !important;
}

.chaos .leaf {
    transform: scale(0) rotate(-540deg) translate(-100px, 200px) !important;
    opacity: 0 !important;
}

.shake-scene {
    animation: stormShake 0.1s 15;
}

@keyframes stormShake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    50% { transform: translate(-1px, -1px) rotate(-0.5deg); }
    100% { transform: translate(1px, -1px) rotate(0.5deg); }
}

/* ===================================================
   TOMBOL: Posisi Lebih Tinggi & Aman dari Home Button HP
====================================================== */
.prank-btn {
    position: absolute;
    bottom: 65px;          /* Dinaikkan ke 65px agar lolos dari navigasi gesture HP */
    left: 50%;
    transform: translateX(-50%) scale(0); 
    padding: 12px 28px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(45deg, #4da6ff, #0066cc);
    border: none;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 102, 204, 0.4);
    z-index: 100;
    opacity: 0;
    animation: buttonFadeIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 7.6s forwards;
    transition: background 0.3s, box-shadow 0.3s, transform 0.2s;
}

@keyframes buttonFadeIn {
    to {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }
}

.prank-btn:hover {
    transform: translateX(-50%) translateY(-2px) scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 102, 204, 0.6);
}

.prank-btn:active {
    transform: translateX(-50%) translateY(1px) scale(0.98);
}

/* ======================
   KOTAK PESAN RAHASIA
====================== */
.message-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 20px; 
}

.message-box {
    background: #111a36;
    border: 2px solid #0066cc;
    padding: 30px 25px;
    border-radius: 15px;
    text-align: center;
    width: 100%;
    max-width: 380px;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transform: scale(0.7);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.message-box h2 {
    font-size: 22px;
    margin-bottom: 15px;
    color: #4da6ff;
}

.message-box p {
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 20px;
    opacity: 0.9;
}

.close-btn {
    padding: 8px 20px;
    background: #0066cc;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s;
}

.close-btn:hover { background: #0052a3; }

/* ======================
   ENVIRONMENT
====================== */
.moon{
    position:absolute;
    top:40px; 
    right:40px;
    width:80px;  
    height:80px;
    border-radius:50%;
    background:#fff8d7;
    box-shadow: 0 0 20px rgba(255,255,220,.8), 0 0 50px rgba(255,255,220,.3);
}

@media (min-width: 768px) {
    .moon {
        top: 80px;
        right: 120px;
        width: 120px;
        height: 120px;
    }
}

.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation: twinkle linear infinite;
}

@keyframes twinkle{
    0%,100%{ opacity:.2; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.8); }
}

.title{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
    color:white;
    z-index: 10;
    padding: 0 20px;
}

.title h1{ font-weight:300; font-size:32px; letter-spacing:2px; }
.title p{ margin-top:6px; opacity:.8; font-size:14px; }

@media (min-width: 768px) {
    .title h1 { font-size: 50px; letter-spacing: 3px; }
    .title p { font-size: 18px; margin-top: 10px; }
}

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:160px; /* Ditambah tingginya agar tombol menapak pas di atas tanah */
    background: linear-gradient(#1f4225, #112614);
    z-index: 5;
}
</style>
</head>

<body>

<div class="message-overlay" id="msgOverlay">
    <div class="message-box" id="msgBox">
        <h2>Roboh bunganya...</h2>
        <p>Hancur deh bunganya...</p>
        <button class="close-btn" onclick="resetGarden()">Nih Buat Bangun Ulang Taman</button>
    </div>
</div>

<div class="scene" id="mainScene">
    <div class="moon"></div>

    <div class="flower-field" id="gardenField">
        <svg class="stem-svg" viewBox="0 0 900 600">
            <ellipse class="bud b1" cx="190" cy="240" rx="14" ry="22" fill="#ff8cbf"/>
            <ellipse class="bud b2" cx="330" cy="190" rx="14" ry="22" fill="#b890ff"/>
            <ellipse class="bud b3" cx="450" cy="120" rx="15" ry="24" fill="#fff4d6"/>
            <ellipse class="bud b4" cx="590" cy="190" rx="14" ry="22" fill="#ffb37f"/>
            <ellipse class="bud b5" cx="710" cy="240" rx="14" ry="22" fill="#ff6f9a"/>

            <path class="stem s1" d="M180 600 C170 500 170 420 190 240"/>
            <path class="stem s2" d="M320 600 C300 500 280 390 330 190"/>
            <path class="stem s3" d="M450 600 C450 500 450 380 450 120"/>
            <path class="stem s4" d="M580 600 C620 500 630 380 590 190"/>
            <path class="stem s5" d="M720 600 C740 500 740 420 710 240"/>

            <g class="tulip t1" style="transform-origin: 190px 240px;">
                <circle cx="190" cy="240" r="30" fill="#ff4f91"/>
                <ellipse cx="190" cy="240" rx="18" ry="32" fill="#ff6fa8" transform="rotate(-15 190 240)"/>
                <ellipse cx="190" cy="240" rx="18" ry="32" fill="#ff6fa8" transform="rotate(15 190 240)"/>
                <ellipse cx="190" cy="240" rx="12" ry="30" fill="#ff8fbd"/>
                <circle cx="190" cy="230" r="5" fill="#fff4d6"/>
            </g>

            <g class="tulip t2" style="transform-origin: 330px 190px;">
                <g fill="#f7c400">
                    <ellipse cx="330" cy="190" rx="12" ry="34" transform="rotate(0 330 190)"/>
                    <ellipse cx="330" cy="190" rx="12" ry="34" transform="rotate(30 330 190)"/>
                    <ellipse cx="330" cy="190" rx="12" ry="34" transform="rotate(60 330 190)"/>
                    <ellipse cx="330" cy="190" rx="12" ry="34" transform="rotate(90 330 190)"/>
                    <ellipse cx="330" cy="190" rx="12" ry="34" transform="rotate(120 330 190)"/>
                    <ellipse cx="330" cy="190" rx="12" ry="34" transform="rotate(150 330 190)"/>
                </g>
                <g fill="#ff9f1c">
                    <circle cx="330" cy="190" r="20"/>
                </g>
                <circle cx="330" cy="190" r="12" fill="#5c3d2e"/>
                <circle cx="330" cy="190" r="6" fill="#ffff3f" opacity="0.5"/>
            </g>

            <g class="tulip t3" style="transform-origin: 450px 120px;">
                <g fill="#ffffff" stroke="#e0e0e0" stroke-width="1">
                    <ellipse cx="450" cy="120" rx="14" ry="38" transform="rotate(0 450 120)"/>
                    <ellipse cx="450" cy="120" rx="14" ry="38" transform="rotate(60 450 120)"/>
                    <ellipse cx="450" cy="120" rx="14" ry="38" transform="rotate(120 450 120)"/>
                </g>
                <circle cx="450" cy="120" r="10" fill="#ffd84d"/>
                <circle cx="450" cy="120" r="5" fill="#ffff3f"/>
            </g>

            <g class="tulip t4" style="transform-origin: 590px 190px;">
                <circle cx="590" cy="190" r="35" fill="#9b2226"/>
                <g fill="#ae2012">
                    <ellipse cx="590" cy="190" rx="20" ry="32" transform="rotate(0 590 190)"/>
                    <ellipse cx="590" cy="190" rx="20" ry="32" transform="rotate(45 590 190)"/>
                    <ellipse cx="590" cy="190" rx="20" ry="32" transform="rotate(90 590 190)"/>
                    <ellipse cx="590" cy="190" rx="20" ry="32" transform="rotate(135 590 190)"/>
                </g>
                <circle cx="590" cy="190" r="18" fill="#e63946"/>
                <circle cx="590" cy="190" r="10" fill="#ff758f"/>
                <circle cx="590" cy="190" r="4" fill="#ffffff" opacity="0.3"/>
            </g>

            <g class="tulip t5" style="transform-origin: 710px 240px;">
                <g fill="#4cc9f0">
                    <ellipse cx="710" cy="240" rx="16" ry="30" transform="rotate(0 710 240)"/>
                    <ellipse cx="710" cy="240" rx="16" ry="30" transform="rotate(72 710 240)"/>
                    <ellipse cx="710" cy="240" rx="16" ry="30" transform="rotate(144 710 240)"/>
                    <ellipse cx="710" cy="240" rx="16" ry="30" transform="rotate(216 710 240)"/>
                    <ellipse cx="710" cy="240" rx="16" ry="30" transform="rotate(288 710 240)"/>
                </g>
                <circle cx="710" cy="240" r="20" fill="#4361ee" opacity="0.5"/>
                <circle cx="710" cy="240" r="8" fill="#ffff3f"/>
                <circle cx="710" cy="240" r="3" fill="#ffffff"/>
            </g>

            <path class="leaf l1" d="M450 480 C410 470, 370 430, 360 380 C390 410, 430 450, 450 480" fill="#3a7d45" style="transform-origin: 450px 480px;"/>
            <path class="leaf l2" d="M450 450 C490 440, 530 400, 550 350 C520 380, 480 420, 450 450" fill="#438e4f" style="transform-origin: 450px 450px;"/>
            <path class="leaf l3" d="M310 520 C270 510, 230 460, 220 410 C250 440, 290 480, 310 520" fill="#3a7d45" style="transform-origin: 310px 520px;"/>
            <path class="leaf l4" d="M590 510 C630 500, 670 450, 690 390 C660 420, 620 470, 590 510" fill="#438e4f" style="transform-origin: 590px 510px;"/>
            <path class="leaf l5" d="M720 570 C730 560, 750 530, 740 500 C735 520, 725 540, 720 570" fill="#4f9e5b" style="transform-origin: 720px 570px;"/>
        </svg>
    </div> 

    <div class="ground">
        <button class="prank-btn" id="actionBtn" onclick="startStorm()">Datangkan Angin!</button>
    </div>
</div>

<script>
/* Efek bintang berkelap-kelip */
for(let i=0;i<180;i++){
    const star = document.createElement("div");
    star.classList.add("star");
    const size = Math.random()*3+1;
    star.style.width = size+"px";
    star.style.height = size+"px";
    star.style.left = Math.random()*100+"vw";
    star.style.top = Math.random()*70+"vh";
    star.style.animationDuration = (Math.random()*4+2)+"s";
    document.body.appendChild(star);
}

/* LOGIKA FUNGSIONAL BADAI & ALERT */
function startStorm() {
    const garden = document.getElementById("gardenField");
    const scene = document.getElementById("mainScene");
    const overlay = document.getElementById("msgOverlay");
    const box = document.getElementById("msgBox");
    const btn = document.getElementById("actionBtn");

    btn.style.opacity = "0";
    btn.style.transform = "translateX(-50%) scale(0)";

    garden.classList.add("chaos");
    scene.classList.add("shake-scene");

    setTimeout(() => {
        overlay.style.display = "flex";
        setTimeout(() => {
            box.style.transform = "scale(1)";
        }, 50);
        scene.classList.remove("shake-scene");
    }, 1200);
}

function resetGarden() {
    const garden = document.getElementById("gardenField");
    const overlay = document.getElementById("msgOverlay");
    const box = document.getElementById("msgBox");
    const btn = document.getElementById("actionBtn");

    box.style.transform = "scale(0.7)";
    setTimeout(() => {
        overlay.style.display = "none";
        garden.classList.remove("chaos");
        
        setTimeout(() => {
            btn.style.opacity = "1";
            btn.style.transform = "translateX(-50%) scale(1)";
        }, 7600);
    }, 200);
}
</script>

</body>
</html>
